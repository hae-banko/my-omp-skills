name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.76.0). Use to retry or backfill a failed release."
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Extract changelog notes
        run: |
          set -euo pipefail
          awk -v ver="${TAG#v}" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ "^## +\\[?v?" ver "\\]?([ ]|$)" { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "::error::No CHANGELOG section found for ${TAG}"; exit 1; fi
      - name: Guard version matches tag
        run: |
          set -euo pipefail
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "${PKG}" != "${TAG#v}" ]; then
            echo "::error::package.json version ${PKG} does not match tag ${TAG}"; exit 1
          fi
      - name: Create or skip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping"
          else
            gh release create "${TAG}" --repo "${{ github.repository }}" --title "${TAG}" --notes-file /tmp/notes.md
          fi
